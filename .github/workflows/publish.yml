name: Publish (npm)

# Publish on a version TAG (not a bare push to main), so shipping a release is an
# explicit, auditable action. NOTE: this package wraps the native iOS/Android
# SDKs — publish/tag those first or consumers can't build against a version that
# doesn't exist yet. Release ritual:
#   1. bump "version" in package.json, merge to main
#   2. git tag v0.0.2 && git push origin v0.0.2   -> this workflow publishes
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.17.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Publish only if the version is new
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER already on npm — skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $NAME@$VER"
          fi

      # `prepare` (react-native-builder-bob) runs automatically on publish; build
      # explicitly too so a failure surfaces before the publish step.
      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run prepare

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
