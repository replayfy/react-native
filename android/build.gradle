buildscript {
  def kotlin_version = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion")
    : project.properties["ReactNative_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Pinned to match the RN 0.76 app's AGP (the lib's buildscript is
    // independent, so it can't inherit the app's managed version).
    classpath "com.android.tools.build:gradle:8.6.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&
    rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

// On the new architecture the React gradle plugin rewrites
// `react-native:+` to the matching `react-android` artifact.
if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name)
    ? rootProject.ext.get(name)
    : project.properties["ReactNative_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name)
    ? rootProject.ext.get(name)
    : (project.properties["ReactNative_" + name]).toInteger()
}

android {
  namespace "com.replayfy.reactnative"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  sourceSets {
    main {
      // The Fabric ViewManager (src/newarch) implements codegen-generated
      // classes that only exist on the New Architecture; the Paper variant
      // (src/oldarch) is plain. Pick the matching one per build.
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch/java"]
      } else {
        java.srcDirs += ["src/oldarch/java"]
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  // PRIMARY: the native Android SDK resolves from Maven Central
  // (app.replayfy:android-sdk) — mirrored + cached, so builds don't fail with
  // "No route to host" the way a single-host JitPack fetch can on corporate/CI
  // networks.
  mavenCentral()
  // FALLBACK: JitPack (com.github.replayfy:android-sdk), on-demand from a git
  // tag. Kept so older pins / pre-Central versions still resolve.
  maven { url "https://jitpack.io" }
  // Dev only — a local `./gradlew :sdk:publishToMavenLocal`.
  mavenLocal()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // The native Android SDK that does the real recording, from Maven Central.
  // NOTE: requires this version published to Central (app.replayfy:android-sdk)
  // — see replay-android-sdk/PUBLISHING.md. Until then the JitPack fallback
  // coordinate is `com.github.replayfy:android-sdk:0.0.3`.
  implementation "app.replayfy:android-sdk:0.0.4"
}
